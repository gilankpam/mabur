<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mabur web GS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="controls">
  <fieldset id="modefield">
    <legend>Mode</legend>
    <label><input type="radio" name="mode" value="gs" id="mode-gs"> GS</label>
    <label><input type="radio" name="mode" value="spotter" id="mode-spotter"> Spotter</label>
  </fieldset>
  <p class="hint">GS mode commands the drone &mdash; only one GS per drone. Use Spotter next to a
    running ground station.</p>
  <div id="params">
    <label>Channel <input type="number" id="ch" min="1" max="196" step="1" inputmode="numeric"></label>
    <label>Width <select id="w">
      <option value="20">20 MHz</option>
      <option value="40">40 MHz</option>
    </select></label>
    <button id="connect" type="button">Connect</button>
  </div>
</header>
<main>
  <div id="videowrap">
    <canvas id="v" width="1280" height="720"></canvas>
    <div id="status" class="hidden"></div>
  </div>
  <details id="stats">
    <summary>Stats</summary>
    <table id="statstable"></table>
    <button id="copystats" type="button">Copy stats</button>
    <span id="copystats-msg" aria-live="polite"></span>
  </details>
</main>
<script src="webgs.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
