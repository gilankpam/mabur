<!doctype html>
<!-- THROWAWAY SPIKE (branch wasm-spike): devourer RX in the browser over WebUSB. -->
<html><head><meta charset="utf-8"><title>rxprobe WebUSB</title>
<style>body{font:14px monospace;margin:16px;background:#111;color:#ddd}button{font:inherit;padding:6px 12px}pre{white-space:pre-wrap}</style>
</head><body>
<p>ch <input id="ch" value="136" size="4"> width <input id="w" value="40" size="3"> secs <input id="s" value="30" size="4">
<button id="go">Connect RTL card + run</button></p>
<pre id="log"></pre>
<script src="build-wasm/rxprobe.js"></script>
<script>
const q = new URLSearchParams(location.search); for (const k of ['ch','w','s']) if (q.get(k)) document.getElementById(k).value = q.get(k);
const log = (t) => { document.getElementById('log').textContent += t + '\n'; console.log(t); };
document.getElementById('go').onclick = async () => {
  if (!crossOriginIsolated) { log('ERROR not crossOriginIsolated (need COOP/COEP)'); return; }
  try {
    const granted = (await navigator.usb.getDevices()).filter(d => d.vendorId === 0x0bda);
    const d = granted[0] || await navigator.usb.requestDevice({filters: [{vendorId: 0x0bda}]});
    log(`picked ${d.productName} ${d.vendorId.toString(16)}:${d.productId.toString(16)}`);
  } catch (e) { log('ERROR requestDevice ' + e); return; }
  const args = ['ch', 'w', 's'].map(id => document.getElementById(id).value);
  createRxProbe({arguments: args, print: log, printErr: (t) => { if (!t.startsWith('{"ev"')) console.log('ERR ' + t); }});
};
</script></body></html>
