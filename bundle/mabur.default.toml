[radio]
usb_vid    = 3034
usb_pid    = 0
channel    = 136
width      = 20
follow_gs  = true        # honour the GS's DISC op_channel (auto channel select)
power_mode = "none"      # set to offset to use rate_walls_rel
tx_threads = 4

# Wall-equalization measured on my vtx not yours, set power_mode to offset to use.
# Calibrated on 8812EU, 2026-09-13, ch136. Values are RELATIVE to the chip's
# own per-channel efuse anchor, so one table covers every channel.
# Only wall_margin_db moves TX power in offset mode.
rate_walls_rel  = [63, 63, 62, 45, 22, 6, 9, 5]
legacy_wall_rel = 63
wall_margin_db  = 1.0

[fec]
symbol_size     = 332      # must match the GS
window          = 32
blocks_per_body = [4, 4]   # base, enhance
base_overhead   = 0.5
feed_batch      = 1        # 1: unchanged when the drone went to agg6 (2026-09-24); no measured win from >1
flush_ms        = 25

[encoder]
bitrate_min_kbps   = 1000
bitrate_max_kbps   = 24000
airtime_budget     = 0.65  # of DELIVERED capacity (air_clock.efficiency)
roi_threshold_kbps = 3000
roi_qp_low         = -24
roi_qp_normal      = 0

[venc]
sensor_bin = "/etc/sensors/imx415_greg_fpvXIX_colortrans.bin"
size       = "1920x1080"
fps        = 60
gop_s      = 0.5
qp_delta   = 4
max_ipprop = 2
min_iqp    = 34            # I-frame QP floor, caps IDR size
intra_refresh_rows = 34
intra_refresh_qp   = 36
ref_base    = 1
ref_enhance = 1
ref_pred    = true
ae_fps      = 15
awb_fps     = 15
snapshot_quality = 80
debug_port  = 8301
superframe_p_pct = 200     # P-frame cap

[venc.roi]
enabled = false            # OFF or roi_qp_low blew up the rung-0 demote IDR
steps   = 2
center  = 0.4

[link]
vtx_id        = 1
failsafe_ms   = 3000
rc_drain_ms   = 5
rendezvous_ms = 30000
move_confirm_ms = 2000  # after a GS-commanded retune, hear the GS within this or return home
tick_ms       = 100

[msp]
enable         = true
serial         = "/dev/ttyS2"
baud           = 115200
update_rate_hz = 3
symbol_size    = 1312
window         = 16
overhead       = 1.0

[low_power]
enable       = true        # disarmed thermal + recovery mode (docs/link-adaptation.md)
bitrate_kbps = 1000
fps          = 30
stale_ms     = 2000        # a DISARMED report older than this = full power

[ampdu]
max_num    = 6             # agg6 from the per-width min_mcs up: the flight config, bench-clean with carrier sense on (2026-09-24). Was 1 (singles) 2026-09-22.
max_time   = 32
min_mcs_20 = 4             # singles below mcs4 at 20 MHz: agg6 delivers 6-13 pts less there (2026-09-17 sweep)
min_mcs_40 = 2             # A-MPDU pays from mcs2 at 40 MHz (2026-09-23 sweep); the 40 rungs are mcs3/4, both aggregate

[air_clock]
shed_ms       = 25         # ARMED shed 25 / eff 0.73 flew clean
efficiency_20 = [0.93, 0.88, 0.84, 0.80, 0.76, 0.76, 0.78, 0.76]  # delivered/nominal per HT MCS at 20 MHz: singles mcs0-3, agg6 above (2026-09-17)
efficiency_40 = [0.77, 0.75, 0.75, 0.75, 0.74, 0.77, 0.76, 0.75]  # agg6 at 40 MHz, flat, no rung-0 exception (2026-09-23)
body_us       = 0
