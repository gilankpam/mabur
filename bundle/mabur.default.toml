# maburd — drone. Installed to /etc/mabur.toml, and baked into the
# openipc-builder image as the shipped default. This IS the flight config as
# it stood on the drone on 2026-09-08 — copied off /etc/mabur.toml verbatim,
# not a hand-written "sensible default". Retune here, not only on the device.
# Config-before-binary: an unknown key fails boot and S96mabur respawns
# forever at 2 s. See docs/deploy.md.

[radio]
usb_vid    = 3034
usb_pid    = 0
channel    = 136
width      = 20
power_mode = "offset"      # adaptive per-rate power; wall_margin_db is the lever

# Wall-equalization measured on this unit; see docs/txagcbench.md.
# Only wall_margin_db moves TX power in offset mode.
rate_walls_idx  = [91, 91, 91, 91, 73, 56, 51, 49]
legacy_wall_idx = 91
wall_margin_db  = 1.0
base_ref_idx    = 53       # derived diffs must land in [-64,63] or boot fails

[fec]
symbol_size     = 332      # mcs6+STBC 1392-1400B frame-length hole — must match the GS
window          = 32
blocks_per_body = [4, 4]   # base, enhance
base_overhead   = 0.5
feed_batch      = 6        # grouped submit, pairs with ampdu.max_num 6
flush_ms        = 25

[encoder]
bitrate_min_kbps   = 1000
bitrate_max_kbps   = 16000
airtime_budget     = 0.5   # 0.5 killed the air-clock drain (peak 47->20 ms)
roi_threshold_kbps = 3000
roi_qp_low         = -24
roi_qp_normal      = 0

[venc]
sensor_bin = "/etc/sensors/imx415_greg_fpvXIX_colortrans.bin"
size       = "1920x1080"
fps        = 60
gop_s      = 2.0
qp_delta   = 4
max_ipprop = 2
min_iqp    = 44            # I-frame QP floor, caps IDR size (docs/iqp-cap-findings-2026-09-06.md)
intra_refresh_rows = 3     # drone is 720p — rally-equivalent is 3, not the 1080p default 4
intra_refresh_qp   = 36
ref_base    = 1
ref_enhance = 1
ref_pred    = true
ae_fps      = 15
awb_fps     = 15
snapshot_quality = 80
debug_port  = 8301
superframe_p_pct = 200     # P-frame cap; see docs/handover-venc-overshoot-2026-09-03.md

[venc.roi]
enabled = false            # OFF since 2026-09-06: roi_qp_low -24 blew up the rung-0 demote IDR
steps   = 2
center  = 0.4

[link]
vtx_id        = 1
failsafe_ms   = 3000
rendezvous_ms = 30000
tick_ms       = 100

[msp]
enable         = true
serial         = "/dev/ttyS2"
baud           = 115200
update_rate_hz = 3
symbol_size    = 1312
window         = 16
overhead       = 1.0

[ampdu]
max_num  = 6               # agg6: fec -2.3/-2.7ms flat-p99
max_time = 32

[air_clock]
shed_ms    = 25            # ARMED shed 25 / eff 0.73 flew clean
efficiency = 0.73
body_us    = 0
