[radio]
usb_vid    = 3034
usb_pid    = 0
channel    = 136
width      = 20
power_mode = "none"      # set to offset to use rate_walls_idx
tx_threads = 4

# Wall-equalization measured on my vtx not yours, set power_mode to offset to use.
# Calibrated on 8812EU
# Only wall_margin_db moves TX power in offset mode.
rate_walls_idx  = [91, 91, 91, 91, 73, 56, 51, 49]
legacy_wall_idx = 91
wall_margin_db  = 1.0
base_ref_idx    = 53       # derived diffs must land in [-64,63] or boot fails

[fec]
symbol_size     = 332      # must match the GS
window          = 32
blocks_per_body = [4, 4]   # base, enhance
base_overhead   = 0.5
feed_batch      = 6        # grouped submit, pairs with ampdu.max_num 6
flush_ms        = 25

[encoder]
bitrate_min_kbps   = 1000
bitrate_max_kbps   = 16000
airtime_budget     = 0.5   # 0.5 killed the air-clock drain (peak 47->20 ms)
roi_threshold_kbps = 3000
roi_qp_low         = -24
roi_qp_normal      = 0

[venc]
sensor_bin = "/etc/sensors/imx415_greg_fpvXIX_colortrans.bin"
size       = "1920x1080"
fps        = 60
gop_s      = 2.0
qp_delta   = 4
max_ipprop = 2
min_iqp    = 44            # I-frame QP floor, caps IDR size
intra_refresh_rows = 3
intra_refresh_qp   = 36
ref_base    = 1
ref_enhance = 1
ref_pred    = true
ae_fps      = 15
awb_fps     = 15
snapshot_quality = 80
debug_port  = 8301
superframe_p_pct = 200     # P-frame cap

[venc.roi]
enabled = false            # OFF or roi_qp_low blew up the rung-0 demote IDR
steps   = 2
center  = 0.4

[link]
vtx_id        = 1
failsafe_ms   = 3000
rc_drain_ms   = 5
rendezvous_ms = 30000
tick_ms       = 100

[msp]
enable         = true
serial         = "/dev/ttyS2"
baud           = 115200
update_rate_hz = 3
symbol_size    = 1312
window         = 16
overhead       = 1.0

[ampdu]
max_num  = 6
max_time = 32

[air_clock]
shed_ms    = 25            # ARMED shed 25 / eff 0.73 flew clean
efficiency = 0.73
body_us    = 0
