# maburd — drone-side configuration (/etc/mabur.toml)
#
# maburd refuses to start on an unknown or misspelled key, and restarts
# every 2 s until the file is fixed: check /tmp/mabur.log after editing.
#
# Only what belongs to this drone. Every other key flies maburd's built-in
# default, which is the flight tuning; the boot log lists them
# ("config: N key(s) defaulted"), docs/deploy.md "Config format".

[radio]
channels = [40, 64, 112, 144]   # the channel set; same as the ground station's
rate_walls_rel_20 = []           # not calibrated; maburcal writes the walls here
rate_walls_rel_40 = []

[link]
key_file = "/etc/mabur.key"     # pairing key; same file on the ground station

[venc]
sensor_bin = "/etc/sensors/imx415_greg_fpvXIX_colortrans.bin"   # camera sensor tuning file
