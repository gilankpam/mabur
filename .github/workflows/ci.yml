name: CI

# Host test suite only. The cross-build (tools/build-arm.sh) needs the OpenIPC
# toolchain, which lives outside this repo, so it cannot run here; see
# docs/deploy.md.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# A newer push to the same ref makes the older run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-suite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mabur
    env:
      NIX_PATH: nixpkgs=channel:nixos-unstable
    steps:
      # The build wants devourer as a SIBLING directory (DEVOURER_DIR defaults
      # to ../devourer). Hence the two-checkout layout.
      # Tracking devourer's master mirrors the dev box; the third_party/devourer
      # submodule pin is NOT the build input and is routinely stale.
      - uses: actions/checkout@v5
        with:
          path: mabur
      - uses: actions/checkout@v5
        with:
          repository: gilankpam/devourer
          ref: master
          path: devourer

      - uses: cachix/install-nix-action@v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Configure
        run: |
          nix-shell -p pkg-config libusb1 --run \
            "cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DDEVOURER_DIR=$GITHUB_WORKSPACE/devourer"

      - name: Build
        run: |
          nix-shell -p pkg-config libusb1 --run \
            "cmake --build build -j$(nproc)"

      # The host suite CLAUDE.md names (test_ / host_e2e) plus the sim_
      # checks (sim_shed_lag, burst_sim_selfcheck), which are not
      # test_-prefixed.
      - name: Test
        run: |
          nix-shell -p pkg-config libusb1 --run \
            "ctest --test-dir build -R 'test_|sim_|host_e2e' -j$(nproc) --output-on-failure"

      - name: Upload ctest log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: ctest-log
          path: mabur/build/Testing/Temporary/LastTest.log
          if-no-files-found: warn

  # The drone<->GS glue tests live in mabur-ground with the GS code. This job
  # runs mabur-ground's host suite and builds mabur-ground's master against THIS checkout of mabur (MABUR_DIR),
  # deliberately ignoring mabur-ground's own submodule pin: the question is
  # whether this change still works with the GS, not whether the pinned
  # mabur does. A PR that changes the wire on purpose stays red here until
  # its paired mabur-ground PR lands on that repo's master.
  ground-downstream:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mabur-ground
    env:
      # run_player_e2e.sh calls `nix-shell -p ffmpeg` itself for the ffprobe /
      # libx265 gates, so <nixpkgs> has to resolve inside the TEST process, not
      # just inside the wrapper below.
      NIX_PATH: nixpkgs=channel:nixos-unstable
    steps:
      - uses: actions/checkout@v5
        with:
          path: mabur
      - uses: actions/checkout@v5
        with:
          repository: gilankpam/mabur-ground
          ref: master
          path: mabur-ground
          submodules: false
      # run_gs_e2e.sh imports ../devourer/tools/precoder/rc_proto.py.
      - uses: actions/checkout@v5
        with:
          repository: gilankpam/devourer
          ref: master
          path: devourer

      - uses: cachix/install-nix-action@v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Configure
        run: |
          nix-shell -p pkg-config libusb1 --run \
            "cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DMABUR_DIR=$GITHUB_WORKSPACE/mabur -DDEVOURER_DIR=$GITHUB_WORKSPACE/devourer"

      - name: Build
        run: |
          nix-shell -p pkg-config libusb1 --run \
            "cmake --build build -j$(nproc)"

      # mabur-ground's whole host suite, not just the glue tests: many of its
      # unit tests run common/ code (aggregator, slice salvage, NACK, UEP
      # decode, DVR mux), and a behaviour change there compiles fine.
      - name: GS suite
        run: |
          nix-shell -p pkg-config libusb1 --run \
            "ctest --test-dir build -R 'test_|gs_e2e|gs_au_e2e|player_e2e|web_au_parity' -j$(nproc) --output-on-failure"

      - name: Upload ctest log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: ground-downstream-ctest-log
          path: mabur-ground/build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
