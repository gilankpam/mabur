ring_path   = "/dev/shm/mabur-au"   # must match maburgs' au_ring.path
socket      = "/run/mabur-au.sock"  # must match maburgs' au_ring.socket
backend     = "mpp"                 # "mpp" | "null"
screen_mode = "1920x1080@60"

[dvr]
autostart   = false        # record button arms it; see input.rec below
dir         = "/media/dvr"
fragment_ms = 1000
mode        = "burned"     # "raw" | "burned"

[dvr.burned]
bitrate_kbps = 8000
fps_cap      = 60

[osd]
enable   = true
port     = 14560           # must match maburgs' msp.out.port
font     = "/usr/local/share/mabur/font_btfl.mfont"
scale    = "sharp"         # "sharp" | "fill"
stale_ms = 5000

[osd.gs]
enable   = true
port     = 8302            # must match a stats.out entry in maburgs.toml
font     = "/usr/local/share/mabur/gs_osd.gfont"
style    = "compact"       # "compact" (two bottom rows) | "essential" (corners)
stale_ms = 3000

# GPIO record button. The whole [input.rec] block is the knob: with it absent
# the player never records unless dvr.autostart is true.
[input.rec]
pin        = 32            # header pin number, resolved by kernel line name
active_low = true          # button to GND with the internal pull-up
bias       = "pull-up"     # "pull-up" | "pull-down" | "none"

[display]
regulate_ms   = 12         # fallback hold while the vblank estimator is cold
vsync_lock    = true
vsync_lead_ms = 6
chain_budget  = 3
