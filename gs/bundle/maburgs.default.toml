# maburgs — ground-station link daemon configuration (/etc/maburgs.toml)
#
# maburgs refuses to start on an unknown or misspelled key, and restarts
# every 2 s until the file is fixed: check /tmp/maburgs.log after editing.
# Keys marked "must match the drone" have a twin in the drone's mabur.toml.

[radio]
channels = [40, 64, 112, 144]   # the channel set: the drone parks on a member, the GS picks among them.
                                # Both ends must list the same set (the drone's may be a superset).
                                # 40 MHz: pair primaries sharing one offset; spur pairs and 124+128
                                # (weather radar) left out. A CPE510 relay cannot tune 144: drop it here.
                                # PROVISIONAL until bench row 8 (maburcal on 64 and 112; swap 64 for 128
                                # if it fails), docs/channel-select.md "Config".
channel  = "auto"               # "auto" = measure the set at start and move the link to the cleanest
                                # member once (boot hop); a member number = pin the link there.
                                # Either way the link first forms wherever the drone is found, then
                                # a hop order moves it to the pick or the pin. A pinned member is static:
                                # the in-flight hop below runs only in auto mode.
width   = 40               # 20 or 40 MHz; 40 is needed for the 40 MHz link speeds in [[link.ladder]] below
tx_card = -1               # card that transmits to the drone; -1 = pick the one with the best signal
relays  = []               # CPE510 mabur-relay units, "ipv4:port" each (UDP 8310, numeric -- no hostnames); each is a card after the USB cards

# Channel search + measurement (docs/channel-select.md). While the link is
# down the spare card sweeps the set, beaconing DISC on each member for
# search_ms to find the drone. In auto mode it also measures every 20 MHz
# half for dwell_ms, min_rounds times, and once the ranking is mature the
# link moves to the cleanest member if it beats the current one by
# pick_margin busy units. One card: op_window_ms beacon windows on op between
# dwells, and a silent one_card_ms measurement before the first DISC.
# Auto only: dwell_ms, settle_ms, min_rounds, pick_margin, one_card_ms, max_ms.
# Both modes: search_ms, op_window_ms, search_after_ms, busy_dbm, blocked_pct.
[radio.scan]
dwell_ms        = 250
settle_ms       = 30
min_rounds      = 3
search_ms       = 100
op_window_ms    = 300
search_after_ms = 5000
pick_margin     = 20
one_card_ms     = 5000
max_ms          = 30000
busy_dbm        = -83   # energy level that counts the air as busy: an NHM bucket edge, -104 -101 -98 -95 -92 -89 -86 -83 -80 -75 -70
blocked_pct     = 50    # % of time the air is busy with others = channel blocked; every measurer uses it (boot scout, in-flight scout, verdict)

# Radio cards: by default maburgs uses every supported card it finds on USB.
# To use only specific cards (e.g. fly one card without unplugging the other),
# uncomment and repeat this block per card; the list then replaces the scan.
# One entry is also the one-card mode switch: no in-flight scout;
# one_card_ms, op_window_ms and one_card_repeats apply.
#[[radio.cards]]
#usb_vid = 3034   # Realtek (0x0bda), in decimal
#usb_pid = 0
#index   = 0

[fec]
symbol_size = 332          # must match the drone
seq_horizon = 512          # how far back (in symbols) a missing piece can still be repaired

[link]
feedback_ms            = 50     # how often link feedback is sent to the drone
rcf_slot_hold_ms       = 30     # time feedback so it doesn't collide with incoming video; 0 = off
arrival_guard_syms     = 192    # how late a packet may arrive before it counts as lost
beacon_keepalive_ms    = 1000   # while linked, re-announce the ground station to the drone this often
static_mcs             = -1     # -1 = adaptive link; 0..7 pins a fixed MCS (bench testing)
static_bw              = 20     # width used with static_mcs; 40 needs radio.width = 40
max_mcs                = 5      # highest MCS the adaptive link may use
key_file               = "/etc/mabur.key"   # pairing key; same file on the drone (docs/deploy.md "Pairing"). Missing = built-in default

# Adaptive link: the link speed is chosen from a ladder of rungs (listed
# below). It steps DOWN a rung when loss goes over down_util for confirm_ms,
# and UP when loss stays under up_util for clean_ms (and the next rung passes
# its probe, see [link.probe]).
down_util              = 0.35   # loss level that triggers a step down (0.35 = 35 % of the repair capacity used)
up_util                = 0.15   # loss must stay under this to step up
confirm_ms             = 250
clean_ms               = 1500
probation_ms           = 3000   # after stepping up, a quick fall back counts as a failed promote
penalty_base_ms        = 5000   # a failed rung is blocked this long, doubling on repeats...
penalty_max_ms         = 10000  # ...up to this
hold_after_down_ms     = 0      # wait after stepping down before stepping up again
min_between_changes_ms = 150    # minimum time between any two rung changes
feedback_timeout_ms    = 1000   # no link reports this long = fall to the most robust rung
starved_confirm_ms     = 300    # no video this long = fall to the most robust rung

# A second loss check on the droppable enhance-layer frames, which show
# trouble earlier than the base layer.
s3_demote              = true   # step down on enhance-layer loss too
s3_down_util           = 0.15   # enhance-layer loss level that triggers a step down
s3_min_syms            = 50     # below this much traffic, a window tells us nothing
s3_settle_ms           = 300    # ignore this check just after a rung change

static_overhead_base   = 0.5    # FEC overhead with static_mcs only
static_overhead_enh    = 0.5    # ...and on the enhance layer

# Ladder rungs, from most robust to fastest. Each rung is an MCS, a channel
# width (20 or 40 MHz; 40 needs radio.width = 40 here and on the drone) and
# the extra FEC repair data per layer (0.5 = +50 %). Keep
# overhead_base >= overhead_enh on every rung: the base layer is the one
# every frame depends on.

[[link.ladder]]
mcs = 0
bw  = 40
overhead_base = 0.5
overhead_enh  = 0.25

[[link.ladder]]
mcs = 1
bw  = 40
overhead_base = 0.5
overhead_enh  = 0.25

[[link.ladder]]
mcs = 2
bw  = 40
overhead_base = 0.5
overhead_enh  = 0.25

[[link.ladder]]
mcs = 3
bw  = 40
overhead_base = 0.5
overhead_enh  = 0.25

[[link.ladder]]
mcs = 4
bw  = 40
overhead_base = 0.5
overhead_enh  = 0.25

# Before stepping up, the drone sends test packets at the next rung; the
# step happens only if they arrive clean.
[link.probe]
enable       = true
rung_offset  = 1           # probe this many rungs above the current one
max_util     = 0.05        # loss allowed on the probe (0.05 = none at 60 probes/s)
clean_bodies = 90          # clean probes needed in a row (1.5 s at 60 fps)
min_syms     = 16          # keep below 2x the drone's low_power.fps, or disarmed probes never pass
silence_ms   = 500         # no probe results this long = the probe counts as failed
pin_mcs      = -1          # -1 = normal; 0..7 always probes this MCS (bench testing)

# Fade handling: step down early when the signal is fading, before loss hits.
[link.fade]
cascade    = true          # after a loss-driven step down, react faster for hold_ms
predict    = true          # step down on a sudden RSSI + SNR drop
hold_ms    = 2500          # how long the faster reaction lasts
confirm_ms = 100           # loss must persist this long to step down during it
rssi_db    = 14.0          # RSSI drop that counts as a fade...
snr_db     = 6.0           # ...together with this SNR drop...
trigger_ms = 300           # ...sustained this long
min_rung   = 2             # never predict-step below this rung

# Software NACK (base layer): ask the drone to re-send symbols FEC could not
# recover. Off by default until flown.
[link.nack]
enable    = false
lookback  = 256    # symbols behind the newest heard that are checked; keep below fec.seq_horizon
repeat_ms = 16     # second request after this if still missing
max_tries = 2      # requests per symbol; 0 = measure only, never ask
min_lead_ms = 12   # do not ask when the answer could not arrive this long before the frame gives up

# Per-rung link history shown in the stats (it does not steer the link).
[link.rung_stats]
half_life_samples = 600    # samples for old data to count half (600 = about 30 s)

[video]
frame_gap_timeout_ms     = 50   # how long to wait for a missing piece of a frame
frame_gap_timeout_max_ms = 100  # the same, upper limit at slow link rates
frame_lookahead          = 8    # frames that may arrive ahead of a stuck one before it is given up

# Flight-controller OSD relayed from the drone, forwarded to maburplay.
[msp]
enable      = true
symbol_size = 1312         # must match the drone
window      = 16           # must match the drone

[msp.out]
host = "127.0.0.1"
port = 14560               # must match maburplay's osd.port

# Link statistics, sent as UDP JSON.
[stats]
enable      = true
interval_ms = 200          # how often stats are sent

[[stats.out]]
host = "127.0.0.1"
port = 8300                # maburtop

[[stats.out]]
host = "127.0.0.1"
port = 8302                # maburplay's on-screen link stats (osd.gs.port)

# Hand-off of received video frames to maburplay (shared memory).
[au_ring]
enable     = true
path       = "/dev/shm/mabur-au"    # must match maburplay's ring_path
socket     = "/run/mabur-au.sock"   # must match maburplay's socket
slot_kb    = 512                    # largest frame that fits, in KB
slot_count = 16                     # frames buffered

# Detailed per-session logs for troubleshooting; off by default.
[debug_log]
enable        = false
dir           = "/media/dvr/log"
ctl_period_ms = 50            # link-state log interval
rung_period_s = 10            # per-rung summary log interval

# In-flight channel hop (docs/inflight-channel-hop.md): when the current
# channel goes bad, move the link to a cleaner member of the set; the spare
# card keeps "scouting" the other members in the background to rank them.
# Runs only with [radio] channel = "auto": a pinned member is static -- the
# channel is still measured (the OSD shows a dirty pin) but the link never
# leaves it.
[hop]
window_ms            = 150    # length of one channel-health check
persist              = 2      # bad checks in a row before hopping
dwell_observe_ms     = 5      # scout: time listening per candidate visit...
dwell_period_ms      = 333    # ...and time between visits
relay_burst_period_ms = 1000  # relay sweep (~280 ms deaf): at most one per this, while hop-free
rank_visits          = 5      # visits remembered per candidate
rank_max_age_ms      = 10000  # visits older than this are ignored
confirm_ms           = 1000   # drone video must appear on the new channel within this, else cancel
confirm_extend_ms    = 3000   # wait up to this instead while the current channel is jammed; 0 = off
verify_ms            = 1000   # after arriving, watch the new channel this long
cooldown_ms          = 2000   # minimum time between hops
max_hops_per_min     = 4      # hop limit
backoff_ms           = 30000  # a channel that proved bad is avoided this long (doubles on repeats)
one_card_repeats     = 5      # single card: send the hop order this many times before retuning

# What counts as a bad channel.
[hop.verdict]
loss_pct             = 3.0    # packet loss %
recovered_x          = 3.0    # FEC repairs this many times above normal
recovered_min        = 8      # ...and at least this many repairs; 0 = off
weak_rssi_dbm        = -78    # below this signal AND weak_snr_db, loss is blamed on range, not interference
weak_snr_db          = 12
fading_drop_db       = 6      # signal this much below its recent level = fading, not interference
foreign_pps          = 50     # other transmitters' packets per second
fa_pps               = 100    # false detections per second (non-Wi-Fi noise)
starved_frac         = 0.25   # video rate below this fraction of normal = starved (keep below 0.5)
